# ==============================================================================
# TPC-C Multi-DBMS Benchmark Configuration
# ==============================================================================

# MySQL 8.0/8.4 (InnoDB Baseline)
mysql.url=jdbc:mysql://localhost:3307/tpcc?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&rewriteBatchedStatements=true&autoReconnect=true
mysql.username=root
mysql.password=rootpassword
mysql.pool.size=20

# TiDB 7.5 (NewSQL Distributed Engine)
tidb.url=jdbc:mysql://localhost:4000/tpcc?useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true&autoReconnect=true
tidb.username=root
tidb.password=
tidb.pool.size=20

# MongoDB 7.0 (NoSQL Document Store - WiredTiger)
mongo.uri=mongodb://localhost:27018/?replicaSet=rs0&directConnection=true
mongo.database=tpcc

# Redis 7 (In-Memory Cache & Conflict Absorber)
redis.host=localhost
redis.port=6379

# TPC-C Workload Defaults
tpcc.warehouses=1
tpcc.scale.items=100000
tpcc.scale.customers=3000

